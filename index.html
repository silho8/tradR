<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="tradR." />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#102a43" />
    <script>
      // Select a separate install identity for the standalone Errand agent app.
      document.addEventListener('DOMContentLoaded', function () {
        if (window.location.pathname.replace(/\/+$/, '') === '/errand') {
          const manifest = document.querySelector('link[rel="manifest"]');
          if (manifest) manifest.setAttribute('href', '/errand.webmanifest');
          document.title = 'tradR. Errand — Delivery agents';
          const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', 'Errand');
          const theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute('content', '#172d22');
          const icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.setAttribute('href', '/errand-mark.svg');
        }
      });
      // Capture the browser install event before the app's module bundle loads.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__tradrInstallPrompt = event;
        window.dispatchEvent(new Event('tradr-install-ready'));
      });
    </script>
    <meta name="description" content="Find your people, find your next thing. The student marketplace for Lead City University." />
    <link rel="icon" type="image/svg+xml" href="/tradr-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>tradR. — Campus finds, made easy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
