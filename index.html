<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="tradR." />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#102a43" />
    <link rel="icon" type="image/svg+xml" href="/tradr-mark.svg" />
    <title>tradR. — Campus finds, made easy</title>
    <script>
      // Write the correct manifest during HTML parsing, before the browser evaluates installability.
      (function () {
        const path = window.location.pathname.replace(/\/+$/, '') || '/';
        const isErrand = path === '/errand';
        const isAdmin = path === '/admin';
        const manifestPath = isErrand ? '/errand.webmanifest' : isAdmin ? '/admin.webmanifest' : '/manifest.webmanifest';
        document.write('<link rel="manifest" href="' + manifestPath + '">');
        if (isErrand || isAdmin) {
          document.title = isErrand ? 'tradR. Errand — Delivery agents' : 'tradR. Admin — Management';
          const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', isErrand ? 'Errand' : 'tradR Admin');
          const theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute('content', isErrand ? '#172d22' : '#102a43');
          const icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.setAttribute('href', isErrand ? '/errand-mark.svg' : '/admin-mark.svg');
        }
      })();
      // Capture the browser install event before the app's module bundle loads.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__tradrInstallPrompt = event;
        window.dispatchEvent(new Event('tradr-install-ready'));
      });
    </script>
    <meta name="description" content="Find your people, find your next thing. The student marketplace for Lead City University." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
